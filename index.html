<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DropNext Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--c:#00bcd4;--cd:#00838f;--ink:#0b2f35;--bg:#f2fafb;--line:#d5eaed;--side:#06353c;--bad:#c93b3b;--ok:#17855c;--warn:#a87400;--mut:#4c7279}
*{box-sizing:border-box}
html,body{overflow-x:hidden}body{margin:0;font:14px/1.5 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg)}img{max-width:100%}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);color:#cfeff3;padding:20px 12px;position:fixed;top:0;left:0;width:210px;height:100vh;overflow:hidden;display:flex;flex-direction:column}
aside h3{margin:0 8px 20px;font-size:20px;font-weight:800;color:#fff}aside h3 span{color:var(--c)}
nav a{display:block;padding:9px 12px;border-radius:8px;color:#cfeff3;cursor:pointer;margin-bottom:2px}
nav a:hover{background:#0b4750}nav a.on{background:var(--c);color:#04282d;font-weight:600}
.side-b{margin-top:auto;font-size:12px;padding:0 8px}.side-b a{color:#8fd8e2;display:block;margin:4px 0;cursor:pointer}
main{padding:24px 28px;width:100%;min-width:0;grid-column:2}
h1{font-size:24px;margin:0 0 18px}h2{font-size:16px;margin:26px 0 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);background:#fff;border-radius:10px}
.stats div{padding:16px 18px;border-right:1px solid var(--line);color:var(--mut)}.stats div:last-child{border:0}
.stats b{display:block;font-size:26px;color:var(--cd)}
.bar{display:grid;grid-template-columns:100px 1fr 30px;gap:10px;align-items:center;margin:6px 0}
.bar div{background:#dff3f6;border-radius:6px;height:10px}.bar i{display:block;height:10px;background:var(--c);border-radius:6px}
.tw{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{font-weight:600;color:var(--mut);background:#f7fcfd}tr:last-child td{border:0}
button{font:inherit;font-weight:600;background:var(--c);color:#04282d;border:0;border-radius:7px;padding:6px 12px;cursor:pointer;margin:2px 4px 2px 0}
button:hover{background:#26cbe0}button.g{background:#e3f1f3;color:var(--ink)}button.r{background:#fbe5e5;color:var(--bad)}button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--cd);outline-offset:2px}
.b{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b.w{background:#fff3d1;color:var(--warn)}.b.i{background:#d9f5f9;color:var(--cd)}.b.g{background:#dcf5e9;color:var(--ok)}.b.r{background:#fbe5e5;color:var(--bad)}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%}
.top{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.top select,.top input{width:auto}
.empty,.load{color:#6a9097;padding:14px}.err{color:var(--bad);padding:14px;background:#fff;border:1px solid var(--line);border-radius:10px}
dialog{border:0;border-radius:12px;padding:22px;width:min(460px,92vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#06353c99}
dialog label{display:block;margin:10px 0;font-weight:600}dialog h2{margin-top:0}.row{display:flex;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:8px 0}.kv span{color:var(--mut)}
.note{border-left:3px solid var(--c);padding:2px 10px;margin:6px 0;background:#f7fcfd}.note small{color:var(--mut)}
#login{position:fixed;inset:0;background:var(--side);display:grid;place-items:center;z-index:9}
#login form{background:#fff;padding:28px;border-radius:14px;width:min(340px,92vw)}#login h1{color:var(--cd)}#login input{margin-bottom:10px}
#lerr{color:var(--bad);min-height:20px;margin-bottom:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;transition:transform .2s;z-index:20;max-width:90vw}
#toast.show{transform:translate(-50%,0)}#toast.bad{background:var(--bad)}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}aside{position:static;width:auto;height:auto;overflow:visible;padding:10px}main{grid-column:1}aside h3{margin-bottom:8px}nav{display:flex;flex-wrap:wrap;gap:4px}nav a{margin:0}.side-b{display:none}main{padding:16px}table,thead,tbody,tr,td{display:block}thead{display:none}tr{padding:6px 0;border-bottom:8px solid var(--bg)}td{display:flex;gap:10px;justify-content:space-between;border:0;padding:5px 12px}td::before{content:attr(data-l);color:var(--mut);font-weight:600;flex:none}td[data-l='']::before{content:none}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.neg{color:var(--bad);font-weight:600}.sub{display:block;color:var(--mut);font-size:12px}
.th{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#eef7f8;flex:none}
.th img,img.pt{width:100%;height:100%;object-fit:cover;display:block}img.pt{width:44px;height:44px;border-radius:8px;border:1px solid var(--line)}
.th button{position:absolute;top:2px;right:2px;margin:0;padding:0 7px;border-radius:50%;line-height:20px;background:#fff;color:var(--bad)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.top input[type=search]{min-width:240px}.cnt{color:var(--mut);font-size:12px;margin:-4px 0 8px}
dialog label small{font-weight:400;color:var(--mut)}dialog textarea{resize:vertical}
.ol{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;max-width:920px}
.oc{background:#e6f1f4;border:1px solid #b3d2d9;border-left:6px solid var(--st,#00bcd4);box-shadow:0 2px 10px rgba(6,53,60,.12);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 14px;background:#d3e7ec;border-bottom:1px solid #b3d2d9}
.oh b{font-size:16px}.oh .dt{margin-left:auto;color:var(--mut);font-size:12px}
.chip{background:#e3f1f3;color:var(--cd);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.cu{margin:10px 14px 4px;padding:9px 12px;background:#fff;border:1px solid #c5dde2;border-radius:10px;display:grid;grid-template-columns:68px minmax(0,1fr);gap:3px 10px;align-items:baseline}.cu .k{color:var(--mut);font-size:12px}.cu b{font-size:15px}.cu span{overflow-wrap:anywhere}
.oid small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600;line-height:1.2}.oid b{font-size:17px}.rs{padding:0 14px 6px;color:var(--mut);font-size:12px}
.onote{margin:4px 14px 6px;background:#fff8e1;border-left:3px solid #e0a800;padding:6px 10px;border-radius:6px;font-size:13px}
.its{padding:2px 14px}.ln{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:start;gap:2px 12px;padding:10px 0;border-bottom:1px dashed var(--line)}.oi{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:#f1f5f6;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:10px}img.oi{display:block}.qb{display:inline-block;background:#fff3d6;color:#8a5a00;border-radius:6px;padding:0 8px;font-weight:700;margin-bottom:2px}.note.auto{border-left-color:#9fb4b8;background:#f4f6f7}.note .src{font-weight:600}.ln:last-child{border:0}
.ln .q{color:var(--mut);font-weight:600}.mt{color:var(--mut);font-size:12px}.lp{font-weight:600;text-align:right}
.tag{display:inline-block;background:#e8f7f1;color:var(--ok);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;margin:3px 6px 0 0}.tag.c{background:#e6f4fb;color:var(--cd)}
.of{margin-top:auto;border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.mn span{display:block;font-size:11px;color:var(--mut)}.mn b{font-size:14px}.acts{margin-left:auto}
.pn{width:68px;padding:5px 6px;text-align:center}.crumb{margin:-6px 0 14px;color:var(--mut)}.crumb a{color:var(--cd);cursor:pointer;font-weight:600}.crumb b{color:var(--ink)}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}a.lk{color:var(--cd);font-weight:700;cursor:pointer;text-decoration:none}a.lk:hover{text-decoration:underline}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 8px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.tile:hover{border-color:var(--c)}button.tl{background:none;color:var(--ink);text-align:left;border:0;border-radius:0;padding:16px 16px 10px;margin:0;font-weight:400;flex:1;width:100%}button.tl:hover{background:#f3fcfd}button.tl b{display:block;font-size:15px}button.tl span{color:var(--mut);font-size:12px}.tf{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);background:#f7fcfd;font-size:12px;color:var(--mut)}.tf label{display:flex;align-items:center;gap:6px;margin:0;font-weight:600}.tf .pn{width:60px}.tf button{margin:0 0 0 4px;padding:3px 9px}
.ic{display:block;width:44px;height:44px;object-fit:contain;margin-bottom:8px}
.icp{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border:1px dashed var(--line);border-radius:10px;background:#eef7f8;margin:6px 0}.icp img{max-width:100%;max-height:100%;object-fit:contain;display:block}
</style></head>
<body>
<div id="login"><form id="lf">
<h1>DropNext Admin</h1><div id="lerr" role="alert"></div>
<input id="lu" placeholder="Admin username" autocomplete="username" aria-label="Username" required>
<input id="lp" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
<button id="lb" style="width:100%;padding:9px">Log in</button></form></div>
<div class="app"><aside><h3>Drop<span>Next</span></h3><nav>
<a data-v="dash">Dashboard</a><a data-v="orders">Orders</a><a data-v="products">Products</a>
<a data-v="resellers">Resellers</a><a data-v="wd">Withdrawals</a><a data-v="notices">Notices</a><a data-v="settings">Settings</a></nav>
<div class="side-b"><a id="dj" target="_blank" rel="noopener">Django admin</a><a id="lo">Log out</a></div></aside>
<main></main></div>
<dialog id="dlg"></dialog><div id="toast"></div>
<script>
// Set this to your Render service. Everything below uses it.
const HOST="https://dropnext-api.onrender.com",API=HOST+"/api";
const ZONE={inside_dhaka:"Inside Dhaka",sub_dhaka:"Sub Dhaka",outside_dhaka:"Outside Dhaka"};
const ST=["Pending","Confirmed","Shipped","Delivered","Cancelled","Returned","NeedsReview"];
const $=s=>document.querySelector(s),J=a=>a.join("");
const money=n=>(n<0?"-":"")+"৳"+Math.abs(Number(n||0)).toLocaleString("en-IN");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=s=>s?new Date(s).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}):"";
const store={get:k=>{try{return localStorage.getItem(k)||""}catch{return ""}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch{}}};
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
let view="dash",dirty=false;
const cache={cats:[],subs:[],orders:[],products:[],resellers:[],wd:[],notices:[],newFiles:[]};
const F={os:"All",oz:"",oq:"",rs:"All",rq:"",ws:"All",wq:"",gq:"",sq:"",sv:"All",sk:"All",ac:""};
const S={prod:{cat:0,sub:0}}; // where the admin is inside Products: categories > sub categories > product list

// ---------- API ----------
async function raw(path,o={},tok){
 const h={};if(tok)h.Authorization="Bearer "+tok;let body;
 if(o.form)body=o.form;else if(o.body){h["Content-Type"]="application/json";body=JSON.stringify(o.body)}
 const r=await fetch(API+path,{method:o.method||"GET",headers:h,body});
 let d=null;try{d=await r.json()}catch{}
 return{r,d}}
function msg(d,r){if(!d)return"Error "+r.status;if(d.error)return d.error;if(d.detail)return d.detail;
 return Object.entries(d).map(([k,v])=>`${k}: ${[].concat(v).join(" ")}`).join(" | ")||"Error "+r.status}
async function api(path,o){
 let{r,d}=await raw(path,o,store.get("at"));
 if(r.status==401&&store.get("rt")){const x=await raw("/auth/refresh/",{method:"POST",body:{refresh:store.get("rt")}});
  if(x.r.ok){store.set("at",x.d.access);({r,d}=await raw(path,o,x.d.access))}else{logout();throw Error("Session expired. Log in again.")}}
 if(r.status==401){logout();throw Error("Session expired. Log in again.")}
 if(!r.ok)throw Error(msg(d,r));return d}
const toast=(t,bad)=>{const e=$("#toast");e.textContent=t;e.className="show"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",bad?4500:2200)};
async function run(fn,ok){try{const x=await fn();if(ok)toast(ok);return x===undefined||x===null?true:x}catch(e){toast(e.message==="Failed to fetch"?"Cannot reach the server (it may be waking up, or CORS blocks this page). Try again.":e.message,1);return null}}
const post=(p,b)=>api(p,{method:"POST",body:b}),patch=(p,b)=>api(p,{method:"PATCH",body:b}),del=p=>api(p,{method:"DELETE"});

// ---------- auth ----------
$("#dj").href=HOST+"/admin/";
$("#lf").onsubmit=async e=>{e.preventDefault();const b=$("#lb");b.disabled=1;b.textContent="Logging in… (server may take ~50s to wake)";$("#lerr").textContent="";
 try{const t=await raw("/auth/login/",{method:"POST",body:{username:$("#lu").value.trim(),password:$("#lp").value}});
  if(!t.r.ok)throw Error(t.r.status==401?"Wrong username or password":msg(t.d,t.r));
  const m=await raw("/me/",{},t.d.access);if(!m.d||!m.d.is_admin)throw Error("This account is not an admin");
  store.set("at",t.d.access);store.set("rt",t.d.refresh);$("#login").style.display="none";$("#lp").value="";go(route())
 }catch(x){$("#lerr").textContent=x.message==="Failed to fetch"?"Cannot reach the server. Check the URL or CORS_ORIGINS.":x.message}
 b.disabled=0;b.textContent="Log in"};
function logout(){store.set("at","");store.set("rt","");$("#login").style.display="grid"}
$("#lo").onclick=logout;
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>{if(a.dataset.v=="products")S.prod={cat:0,sub:0};go(a.dataset.v)});
$("#dlg").addEventListener("close",()=>{if(dirty){dirty=false;go(view)}});

// ---------- helpers ----------
const badge=(s,t)=>`<span class="b ${{Pending:"w",pending:"w",Confirmed:"i",Shipped:"i",NeedsReview:"w",Delivered:"g",approved:"g",Paid:"g",Active:"g",Pinned:"i"}[s]||"r"}">${esc(t||s)}</span>`;
const tbl=(h,rows,empty)=>rows.length?`<div class="tw"><table><thead><tr>${J(h.map(x=>`<th>${x}</th>`))}</tr></thead><tbody>${J(rows.map(r=>{let i=0;return r.replace(/<td/g,()=>`<td data-l="${esc(h[i++]||"")}"`)}))}</tbody></table></div>`:`<p class="empty">${empty||"Nothing here yet."}</p>`;
const itemsTxt=o=>o.items.map(i=>`${esc(i.product)} ×${i.qty}`).join(", ");
const imgSrc=u=>u?(u[0]=="/"?HOST+u:u):"";
const lineHtml=i=>{const src=imgSrc(i.image);return `<div class="ln">${src?`<a href="${esc(src)}" target="_blank" rel="noopener"><img class="oi" src="${esc(src)}" alt="" loading="lazy"></a>`:`<div class="oi">No photo</div>`}<div><b>${esc(i.product||"(deleted product)")}</b>${i.code?` <span class="chip">${esc(i.code)}</span>`:""}${i.category||i.subcategory?`<div class="mt">${esc(i.category||"-")} › ${esc(i.subcategory||"-")}</div>`:""}${i.size||i.color?`<div>${i.size?`<span class="tag">Size: ${esc(i.size)}</span>`:""}${i.color?`<span class="tag c">Color: ${esc(i.color)}</span>`:""}</div>`:""}</div><div class="lp"><span class="qb">× ${i.qty}</span><div>${money(i.sell*i.qty)}</div><div class="mt">${money(i.sell)} each</div></div></div>`};
const ST_COL={Pending:"#e0a800",Confirmed:"#00bcd4",Shipped:"#3b7be0",Delivered:"#17855c",Cancelled:"#c93b3b",Returned:"#8a4fc9",NeedsReview:"#e07b00"};
function orderCard(o){return `<div class="oc" style="--st:${ST_COL[o.status]||"#00bcd4"}"><div class="oh"><span class="oid"><small>Order ID</small><b>${esc(o.code)}</b></span>${badge(o.status)}<span class="chip">${esc(ZONE[o.zone]||o.zone)}</span><span class="dt">${dt(o.created)}</span></div>
<div class="cu"><span class="k">Customer</span><b>${esc(o.customer)}</b><span class="k">Phone</span><span>${esc(o.phone)}</span><span class="k">Address</span><span>${esc(o.address)}</span></div>
${o.note?`<div class="onote"><b>Customer note:</b> ${esc(o.note)}</div>`:""}<div class="rs">Reseller: <b>${esc(o.reseller)}</b></div>
<div class="its">${J(o.items.map(lineHtml))}</div>
<div class="of"><div class="mn"><span>COD</span><b>${money(o.cod)}</b></div><div class="mn"><span>Delivery</span><b>${money(o.delivery_fee)}</b></div><div class="mn"><span>Reseller profit</span><b>${money(o.profit)}</b></div><div class="acts">${quick(o)}<button class="g" onclick="odet(${o.id})">Details</button></div></div></div>`}
const opts=(list,sel)=>J(list.map(([v,t])=>`<option value="${esc(v)}" ${v==sel?"selected":""}>${esc(t)}</option>`));
const short=(s,n)=>s?esc(s.length>n?s.slice(0,n)+"…":s):"";
const wn=s=>(s.trim().match(/\S+/g)||[]).length;
const has=(q,...f)=>{q=q.trim().toLowerCase();return !q||f.some(x=>String(x??"").toLowerCase().includes(q))};
const refresh=()=>view=="orders"?loadOrders():go(view);

// ---------- orders ----------
const NEXT={Pending:["confirm","Confirm"],Confirmed:["ship","Mark shipped"],Shipped:["Delivered","Mark delivered"],NeedsReview:["details","Resolve"]};
const RET="Mark as Returned?\n\nThe parcel is back, so its delivery charge will be taken from the reseller's balance (the balance can go below zero).";
function quick(o){const n=NEXT[o.status];if(!n)return"";
 return n[0]=="details"?`<button onclick="odet(${o.id})">${n[1]}</button>`:n[0]=="ship"?`<button onclick="ship(${o.id})">${n[1]}</button>`:`<button onclick="oact(${o.id},'${n[0]}')">${n[1]}</button>`}
async function oact(id,a,extra){
 if(a=="Returned"&&!confirm(RET))return;
 const path=a=="confirm"||a=="cancel"||a=="resolve"?`/admin/orders/${id}/${a}/`:`/admin/orders/${id}/status/`;
 const body=a=="confirm"||a=="cancel"?undefined:a=="resolve"?extra:a=="Shipped"&&extra?{status:a,tracking_url:extra}:{status:a};
 const o=await run(()=>post(path,body),"Order updated");if(o){$("#dlg").open&&$("#dlg").close();refresh()}}
function ship(id){const t=prompt("Steadfast tracking link (optional - leave empty to skip)\n\nExample: https://steadfast.com.bd/tl/...","");if(t===null)return;oact(id,"Shipped",t.trim()||undefined)}
async function trk(id){const o0=cache.orders.find(x=>x.id==id);const t=prompt("Steadfast tracking link (empty = remove the link)",o0?.tracking_url||"");if(t===null)return;
 const o=await run(()=>post(`/admin/orders/${id}/tracking/`,{tracking_url:t.trim()}),"Tracking link saved");if(o&&o!==true){const i=cache.orders.findIndex(x=>x.id==id);cache.orders[i]=o;odet(id)}}
function odet(id){const o=cache.orders.find(x=>x.id==id);if(!o)return;const a=[];
 if(o.status=="Pending")a.push(`<button onclick="oact(${id},'confirm')">Confirm</button><button class="r" onclick="if(confirm('Cancel this order?'))oact(${id},'cancel')">Cancel order</button>`);
 if(o.status=="Confirmed")a.push(`<button onclick="ship(${id})">Mark shipped</button>`);
 if(["Shipped","NeedsReview","Delivered","Returned"].includes(o.status))a.push(`<button onclick="trk(${id})">${o.tracking_url?"Change":"Add"} tracking link</button>`);
 if(["Confirmed","Shipped","NeedsReview"].includes(o.status))a.push(`<button onclick="oact(${id},'Delivered')">Mark delivered</button><button class="r" onclick="oact(${id},'Returned')">Mark returned</button>`);
 if(o.status=="NeedsReview")a.push(`<button class="g" onclick="ores(${id})">Resolve with custom profit</button>`);
 $("#dlg").innerHTML=`<h2 tabindex="-1" autofocus style="outline:0">${esc(o.code)} ${badge(o.status)}</h2>

async function shrink(f){ // max 2000px JPEG: faster uploads and always under the 8 MB limit
 try{if(f.size<1.5e6&&/jpe?g/i.test(f.type))return f;
  const bm=await createImageBitmap(f),s=Math.min(1,2000/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
  c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));return b?new File([b],(f.name.replace(/\.\w+$/,"")||"photo")+".jpg",{type:"image/jpeg"}):f}catch{return f}}

// ---------- resellers / withdrawals (filtered in the browser) ----------
function renderResellers(){const l=cache.resellers.filter(x=>(F.rs=="All"||x.status==F.rs)&&has(F.rq,x.name,x.phone,x.shop_name)),box=$("#rt");if(!box)return;
 box.innerHTML=`<p class="cnt">${l.length} of ${cache.resellers.length}</p>`+tbl(["Name","Phone","Shop","Verified","Status","Balance","Action"],l.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.shop_name)}${x.shop_link?`<span class="sub">${/^https?:\/\//i.test(x.shop_link)?`<a class="lk" href="${esc(x.shop_link)}" target="_blank" rel="noopener noreferrer">${esc(x.shop_link)}</a>`:esc(x.shop_link)}</span>`:""}</td><td>${x.verified?"Yes":"No"}</td><td>${badge(x.status)}</td><td class="${x.balance<0?"neg":""}">${money(x.balance)} <button class="g" onclick="ebal(${x.id})">Edit</button></td><td>${x.status=="pending"?`<button onclick="rst(${x.id},'approved')">Approve</button><button class="r" onclick="rst(${x.id},'blocked')">Reject</button>`:x.status=="approved"?`<button class="r" onclick="rst(${x.id},'blocked')">Block</button>`:`<button class="g" onclick="rst(${x.id},'approved')">Unblock</button>`}</td></tr>`),"No resellers match.")}
function renderWd(){const l=cache.wd.filter(x=>(F.ws=="All"||x.status==F.ws)&&has(F.wq,x.reseller,x.phone,x.account)),box=$("#wt");if(!box)return;
 box.innerHTML=`<p class="cnt">${l.length} of ${cache.wd.length}</p>`+tbl(["Reseller","Balance at request","Current balance","Amount","Send to","Status","Date","Action"],l.map(x=>`<tr><td>${esc(x.reseller)}<span class="sub">${esc(x.phone)}</span></td><td>${x.balance_before==null?"-":money(x.balance_before)}</td><td class="${x.balance<0?"neg":""}"><b>${money(x.balance)}</b></td><td>${money(x.amount)}</td><td>${esc(x.account)}</td><td>${badge(x.status)}</td><td>${dt(x.created)}</td><td>${x.status=="Pending"?`<button onclick="wst(${x.id},'paid')">Mark as paid</button><button class="r" onclick="wst(${x.id},'reject')">Reject</button>`:"-"}</td></tr>`),"No withdrawals match.")}
async function ebal(id){const x=cache.resellers.find(r=>r.id==id);if(!x)return;
 const v=prompt(`Set the new balance for ${x.name} (${x.phone}).\nCurrent balance: ${x.balance}`,x.balance);if(v===null)return;
 const n=parseInt(String(v).trim(),10);if(!/^-?\d+$/.test(String(v).trim())||isNaN(n)){toast("Enter a whole number",1);return}
 if(n==x.balance){toast("The balance is already that amount",1);return}
 const note=prompt("Reason (optional, up to 20 characters, shown in the ledger):","")||"";
 if(!confirm(`Change ${x.name}'s balance from ${money(x.balance)} to ${money(n)} (${n-x.balance>0?"+":""}${n-x.balance})?`))return;
 if(await run(()=>post(`/admin/resellers/${id}/balance/`,{balance:n,note:note.trim().slice(0,20)}),"Balance updated"))go("resellers")}
const rst=async(id,s)=>{if(await run(()=>post(`/admin/resellers/${id}/status/`,{status:s}),"Reseller "+s))go("resellers")};
async function wst(id,a){if(a=="reject"&&!confirm("Reject and return the amount to the reseller's balance?"))return;
 if(await run(()=>post(`/admin/withdraws/${id}/${a}/`),a=="paid"?"Marked as paid":"Rejected, amount returned"))go("wd")}

// ---------- notices ----------
function nform(id){const n=cache.notices.find(x=>x.id==id)||{title:"",body:"",pinned:false,active:true};
 $("#dlg").innerHTML=`<h2>${id?"Edit":"New"} notice</h2><label>Title<input id="nti" maxlength="120" value="${esc(n.title)}"></label><label>Message<textarea id="nb" rows="6" maxlength="2000" placeholder="What should resellers know?">${esc(n.body)}</textarea></label>
 <label><input id="np" type="checkbox" style="width:auto" ${n.pinned?"checked":""}> Pin to the top</label><label><input id="na" type="checkbox" style="width:auto" ${n.active?"checked":""}> Visible to resellers</label>
 <div class="row"><button class="g" onclick="$('#dlg').close()">Cancel</button><button onclick="nsave(${id})">Save notice</button></div>`;$("#dlg").showModal()}
async function nsave(id){const b={title:$("#nti").value.trim(),body:$("#nb").value.trim(),pinned:$("#np").checked,active:$("#na").checked};if(!b.title)return toast("Enter a title",1);
 if(await run(()=>api(id?`/admin/notices/${id}/`:"/admin/notices/",{method:id?"PATCH":"POST",body:b}),"Notice saved")){$("#dlg").close();go("notices")}}
async function ntog(id){const n=cache.notices.find(x=>x.id==id);if(await run(()=>patch(`/admin/notices/${id}/`,{active:!n.active}),n.active?"Notice hidden":"Notice visible"))go("notices")}
async function ndel(id){if(!confirm("Delete this notice?"))return;if(await run(()=>del(`/admin/notices/${id}/`),"Notice deleted"))go("notices")}

// ---------- views ----------
const V={
async dash(){const d=await api("/admin/dashboard/"),c=d.orders,mx=Math.max(...ST.map(s=>c[s]||0),1);
 return `<h1>Dashboard</h1><div class="stats"><div><b>${d.resellers_total??0}</b>total resellers</div><div><b>${d.orders_total??0}</b>total orders</div><div><b>${c.Pending||0}</b>orders to confirm</div><div><b>${d.resellers_pending}</b>resellers to approve</div><div><b>${d.withdraws_pending}</b>withdrawals to review</div><div><b class="${d.reseller_balances<0?"neg":""}">${money(d.reseller_balances)}</b>reseller balances</div></div><h2>Orders by status</h2>${J(ST.map(s=>`<div class="bar"><span>${s}</span><div><i style="width:${(c[s]||0)/mx*100}%"></i></div><em>${c[s]||0}</em></div>`))}`},
async orders(){return `<h1>Orders</h1><div class="top"><select aria-label="Filter by status" onchange="F.os=this.value;loadOrders()">${opts(["All",...ST].map(s=>[s,s]),F.os)}</select><select aria-label="Filter by area" onchange="F.oz=this.value;loadOrders()">${opts([["","All areas"],...Object.entries(ZONE)],F.oz)}</select><input type="search" aria-label="Search orders" placeholder="Search code, customer, phone, reseller, note" value="${esc(F.oq)}" oninput="F.oq=this.value;oqs()"><button class="g" onclick="loadOrders()">Refresh</button></div><div id="ot"></div>`},
async products(){const{c,s}=await catalog(),t=S.prod,cat=c.find(x=>x.id==t.cat);
 if(!cat){t.cat=0;t.sub=0;return `<h1>Products</h1><div class="top"><input type="search" aria-label="Search all products" placeholder="Search all products (code, name, description, category, size, color)" value="${esc(F.gq)}" style="min-width:320px" oninput="F.gq=this.value;renderGlobal()"></div><div class="top"><input id="cnn" maxlength="60" placeholder="New category name" aria-label="Category name" style="min-width:260px" onkeydown="if(event.key=='Enter')cadd()"><input id="cni" type="file" accept="image/*" aria-label="Category icon (optional)" title="Icon (optional)" style="max-width:230px"><button onclick="cadd()">Add category</button></div><p class="empty" style="padding:0 0 6px">Choose a category.</p>${HINT}<div id="pt"></div>`}
 const sub=s.find(x=>x.id==t.sub&&x.category==cat.id);
 if(!sub){t.sub=0;const subs=s.filter(x=>x.category==cat.id);
  return `<h1>${esc(cat.name)}</h1>${crumbs(cat,null)}<div class="top"><input id="an" maxlength="60" placeholder="New sub category in ${esc(cat.name)}" aria-label="Sub category name" style="min-width:260px" onkeydown="if(event.key=='Enter')sadd(${cat.id})"><input id="ai" type="file" accept="image/*" aria-label="Sub category icon (optional)" title="Icon (optional)" style="max-width:230px"><button onclick="sadd(${cat.id})">Add sub category</button></div>${HINT}${subs.length?`<div class="tiles">${J(subs.map(subTile))}</div>`:'<p class="empty">No sub categories yet. Add the first one above.</p>'}`}
 return `<h1>${esc(sub.name)}</h1>${crumbs(cat,sub)}<div class="top"><button onclick="pform(0,${sub.id})">Add product</button><input type="search" aria-label="Search products" placeholder="Search code (e.g. EP1008), name, description, size, color" value="${esc(F.sq)}" oninput="F.sq=this.value;renderSub()"><select aria-label="Visibility" onchange="F.sv=this.value;renderSub()">${opts([["All","Visible and hidden"],["1","Visible"],["0","Hidden"]],F.sv)}</select><select aria-label="Stock" onchange="F.sk=this.value;renderSub()">${opts([["All","Any stock"],["1","In stock"],["0","Out of stock"]],F.sk)}</select></div>${HINT}<div id="pt"></div>`},
async resellers(){cache.resellers=await api("/admin/resellers/");
 return `<h1>Resellers</h1><div class="top"><select aria-label="Filter by status" onchange="F.rs=this.value;renderResellers()">${opts(["All","pending","approved","blocked"].map(s=>[s,s=="All"?"All statuses":s]),F.rs)}</select><input type="search" aria-label="Search resellers" placeholder="Search name, phone, shop" value="${esc(F.rq)}" oninput="F.rq=this.value;renderResellers()"></div><div id="rt"></div>`},
async wd(){cache.wd=await api("/admin/withdraws/");
 return `<h1>Withdrawals</h1><div class="top"><select aria-label="Filter by status" onchange="F.ws=this.value;renderWd()">${opts(["All","Pending","Paid","Rejected"].map(s=>[s,s=="All"?"All statuses":s]),F.ws)}</select><input type="search" aria-label="Search withdrawals" placeholder="Search reseller, phone, account" value="${esc(F.wq)}" oninput="F.wq=this.value;renderWd()"></div><div id="wt"></div>`},
async notices(){cache.notices=await api("/admin/notices/");
 return `<h1>Notices</h1><div class="top"><button onclick="nform(0)">New notice</button></div>`+
 tbl(["Title","Message","Pinned","Status","Date","Action"],cache.notices.map(n=>`<tr><td>${esc(n.title)}</td><td title="${esc(n.body)}">${short(n.body,60)||"-"}</td><td>${n.pinned?badge("Pinned"):"-"}</td><td>${n.active?badge("Active"):badge("Hidden")}</td><td>${dt(n.created)}</td><td><button class="g" onclick="nform(${n.id})">Edit</button><button class="g" onclick="ntog(${n.id})">${n.active?"Hide":"Show"}</button><button class="r" onclick="ndel(${n.id})">Delete</button></td></tr>`))},
async settings(){const s=await api("/admin/settings/");
 return `<h1>Settings</h1><div class="tw" style="padding:18px;max-width:420px"><h2 style="margin-top:0">Delivery charge</h2><label>Inside Dhaka (৳)<input id="s1" type="number" inputmode="numeric" min="0" value="${s.delivery_inside}"></label><label>Sub Dhaka (৳)<input id="s4" type="number" inputmode="numeric" min="0" value="${s.delivery_sub}"></label><label>Outside Dhaka (৳)<input id="s5" type="number" inputmode="numeric" min="0" value="${s.delivery_outside}"></label><h2>Wallet</h2><label>Minimum withdraw (৳)<input id="s2" type="number" inputmode="numeric" min="0" value="${s.min_withdraw}"></label><label>Hold days before profit is withdrawable<input id="s3" type="number" inputmode="numeric" min="0" value="${s.hold_days}"></label><button onclick="ssave()">Save settings</button></div>`}};
const AFTER={orders:loadOrders,products:AFTER_SUB,resellers:renderResellers,wd:renderWd};
// Back / Forward / Refresh: the address bar keeps the page and the category > sub category place (e.g. #products/3/12)
let firstGo=true;
const hashOf=()=>"#"+view+(view=="products"&&S.prod.cat?"/"+S.prod.cat+(S.prod.sub?"/"+S.prod.sub:""):"");
function route(){const m=location.hash.replace(/^#/,"").split("/"),v=V[m[0]]?m[0]:"dash";S.prod=v=="products"?{cat:+m[1]||0,sub:+m[2]||0}:{cat:0,sub:0};return v}
window.addEventListener("popstate",()=>{if(!store.get("at"))return;const d=$("#dlg");if(d.open){dirty=false;d.close()}go(route())});
async function go(v){view=v;const hh=hashOf();if(hh!==location.hash){if(firstGo)history.replaceState(null,"",hh);else history.pushState(null,"",hh)}firstGo=false;
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v==v));
 const m=$("main");m.innerHTML='<p class="load">Loading…</p>';
 try{const h=await V[v]();if(view==v){m.innerHTML=h;if(AFTER[v])AFTER[v]()}}catch(e){if(view==v)m.innerHTML=`<div class="err">${esc(e.message==="Failed to fetch"?"Cannot reach the server. It may be waking up (free Render plan), or CORS is blocking this page.":e.message)}<br><button style="margin-top:8px" onclick="go('${v}')">Try again</button></div>`}}
async function ssave(){const b={delivery_inside:$("#s1").value,delivery_sub:$("#s4").value,delivery_outside:$("#s5").value,min_withdraw:$("#s2").value,hold_days:$("#s3").value};
 if(await run(()=>post("/admin/settings/",b),"Settings saved"))go("settings")}

// ---------- start ----------
if(store.get("at")){$("#login").style.display="none";go(route())}
</script></body></html>
